# Route packets between the WireGuard interface and the WAN.
net.ipv4.ip_forward = @IPV4_FORWARD@

# IPv6 (the tunnel itself is IPv4-only).
@IPV6_BLOCK@

# Connection-tracking table size.
@CONNTRACK_LINE@
