# =============================================================================
# wg-relay WireGuard interface. GENERATED by install.sh from config.env.
# Do not edit here: edit config.env and re-run install.sh.
#
# The private key is deliberately NOT stored in this file. PostUp loads it from
# the key file, so this config contains no secrets and is safe to share in
# diagnostics output.
#
# The peer has no Endpoint: OPNsense initiates the connection, and WireGuard
# learns (and follows) the peer's current public address automatically, which
# is what makes a CGNAT LTE connection work.
# =============================================================================

[Interface]
Address = @WG_SERVER_ADDRESS@
ListenPort = @WG_PORT@
MTU = @WG_MTU@
@POSTUP@

@PEER_SECTION@
